# Construit, signe et publie le flux Gousset chaque lundi (AND-NET-04, ADR 0037).
# Les fichiers vont sur la branche gh-pages, que GitHub Pages sert sous https://bastiensabos.github.io/gousset-flux/.
name: Publier le flux

on:
  schedule:
    - cron: "17 5 * * 1"   # le lundi vers 6 h (heure de Paris)
  workflow_dispatch:
    inputs:
      logements:
        description: "Retélécharger les ventes DVF même si elles n'ont pas changé"
        type: boolean
        default: false

# Les actions sont épinglées par empreinte, pas par étiquette : une étiquette déplacée ne peut pas faire tourner du code
# tiers à côté de la clé de signature du flux. Dependabot propose les nouvelles empreintes.
permissions:
  contents: write   # pousser sur gh-pages ; rien d'autre

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Le lancement à la main depuis une autre branche ne doit pas lire la clé de signature : l'environnement « flux »
    # (Réglages › Environments) porte les secrets et n'accepte que main ; le test de branche double cette règle.
    if: github.ref == 'refs/heads/main'
    environment: flux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # le code de construction ne voit pas le jeton d'écriture ; seule l'étape « Publier » l'utilise

      - name: Récupérer ce qui est déjà publié
        run: |
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add public origin/gh-pages
          else
            git worktree add --orphan -b gh-pages public
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Construire et signer
        env:
          FLUX_SIGNING_KEY: ${{ secrets.FLUX_SIGNING_KEY }}
          WEBSTAT_API_KEY: ${{ secrets.WEBSTAT_API_KEY }}
        run: |
          # Les ventes DVF ne se retéléchargent que si DVF a été mis à jour depuis la dernière construction
          # (build.py le vérifie d'une requête légère) ; la case « logements » force le retéléchargement.
          if [ "${{ inputs.logements }}" = "true" ]; then
            python3 build.py --out public --force-homes
          else
            python3 build.py --out public
          fi

      - name: Publier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd public
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de neuf à publier."
            exit 0
          fi
          git -c user.name="gousset-flux" -c user.email="actions@users.noreply.github.com" \
            commit -qm "Flux du $(date +%F)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages
